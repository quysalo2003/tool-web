<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử Lý Văn Bản</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        textarea { width: 90%; max-width: 600px; height: 150px; padding: 15px; border-radius: 10px; border: none; margin-bottom: 10px; box-sizing: border-box; }
        .stats { margin-bottom: 20px; color: #38bdf8; font-weight: bold; }
        .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .back { color: #888; text-decoration: none; display: block; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>XỬ LÝ VĂN BẢN</h1>
    <textarea id="text" placeholder="Nhập văn bản vào đây..." oninput="updateStats()"></textarea>
    
    <div class="stats" id="stats">Ký tự: 0 | Từ: 0</div>
    
    <div class="buttons">
        <button onclick="transform('upper')">VIẾT HOA</button>
        <button onclick="transform('lower')">viết thường</button>
        <button onclick="transform('reverse')">ĐẢO NGƯỢC</button>
        <button onclick="copyText()">COPY</button>
    </div>
    
    <a href="index.html" class="back">← Quay lại trang chủ</a>

    <script>
        function updateStats() {
            let val = document.getElementById("text").value;
            let charCount = val.length;
            let wordCount = val.trim() ? val.trim().split(/\s+/).length : 0;
            document.getElementById("stats").innerText = `Ký tự: ${charCount} | Từ: ${wordCount}`;
        }

        function transform(type) {
            let text = document.getElementById("text").value;
            if(type === 'upper') document.getElementById("text").value = text.toUpperCase();
            if(type === 'lower') document.getElementById("text").value = text.toLowerCase();
            if(type === 'reverse') document.getElementById("text").value = text.split("").reverse().join("");
            updateStats();
        }

        function copyText() {
            let copyText = document.getElementById("text");
            copyText.select();
            document.execCommand("copy");
            alert("Đã copy!");
        }
    </script>
</body>
</html>
