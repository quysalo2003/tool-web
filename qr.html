<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Mã QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: none; margin-bottom: 20px; box-sizing: border-box; max-width: 400px; }
        button { padding: 15px 30px; background: #38bdf8; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* Mặc định ẩn khung trắng */
        #qrcode { 
            margin: 30px auto; 
            background: white; 
            padding: 20px; 
            display: none; 
            border-radius: 10px;
        }
        
        .back { color: #38bdf8; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>TẠO MÃ QR</h1>
    <input type="text" id="text" placeholder="Nhập nội dung vào đây...">
    <button onclick="generate()">TẠO MÃ</button>
    <div id="qrcode"></div>
    <a href="index.html" class="back">← Quay lại trang chủ</a>

    <script>
        function generate() {
            var el = document.getElementById("qrcode");
            var inputVal = document.getElementById("text").value;
            
            if(inputVal.trim() !== "") {
                el.innerHTML = "";
                el.style.display = "inline-block"; // Hiện khung lên khi có QR
                new QRCode(el, {
                    text: inputVal,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                el.style.display = "none"; // Ẩn nếu không nhập gì
            }
        }
    </script>
</body>
</html>
